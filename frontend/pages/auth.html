<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070B14">
  <title>Acessar — TalkDevCode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <script type="module" src="../js/auth.js"></script>
</head>
<body class="auth-page">
  <a class="skip-link" href="#auth-main">Pular para o formulário</a>
  <header class="auth-header">
    <a class="brand" href="../"><span class="brand-mark">&lt;/&gt;</span><span>Talk<span class="brand-accent">Dev</span>Code</span></a>
    <button class="icon-button" id="theme-toggle" type="button" aria-label="Alternar tema">☀</button>
  </header>
  <main class="auth-main" id="auth-main">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-intro"><span class="brand-mark large">&lt;/&gt;</span><p class="eyebrow">SUA COMUNIDADE DEV</p><h1 id="auth-title">Bom ter você por aqui.</h1><p id="auth-description">Entre para acompanhar ideias e conversas.</p></div>
      <div class="auth-tabs" role="tablist" aria-label="Tipo de acesso">
        <button class="auth-tab active" id="login-tab" type="button" role="tab" aria-selected="true" data-mode="login">Entrar</button>
        <button class="auth-tab" id="register-tab" type="button" role="tab" aria-selected="false" data-mode="register">Criar conta</button>
      </div>
      <form id="auth-form" novalidate>
        <div class="field-group" id="username-group"><label for="username">Nome de usuário</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="50" required placeholder="seu_usuario"><small>Use letras, números, ponto, hífen ou underline.</small></div>
        <div class="field-group hidden" id="email-group"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" maxlength="100" placeholder="voce@exemplo.com"></div>
        <div class="field-group"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required placeholder="Mínimo de 8 caracteres"></div>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="button button-primary button-full" id="auth-submit" type="submit">Entrar</button>
      </form>
      <p class="auth-switch" id="auth-switch">Ainda não tem conta? <button type="button" data-switch="register">Criar conta</button></p>
      <a class="back-link" href="../">← Voltar para os artigos</a>
    </section>
  </main>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
</body>
</html>
